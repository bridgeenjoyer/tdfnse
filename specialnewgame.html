<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wayfarer Kingdoms — Tower Defense</title>
<style>
  :root{
    --ink:#2b2320; --parch:#f6ecd8; --parch2:#eadfc4; --line:#c9b186;
    --gold:#c8892b; --gold2:#f0c36a; --leaf:#4f7a3a; --berry:#a33b3b;
    --sky:#7fb0c9; --shadow:0 3px 0 rgba(0,0,0,.18), 0 10px 22px rgba(0,0,0,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Trebuchet MS",Verdana,sans-serif;color:var(--ink);
    background:
      radial-gradient(circle at 20% 10%, #fff6e2 0%, transparent 60%),
      radial-gradient(circle at 85% 80%, #ffe9c2 0%, transparent 55%),
      repeating-linear-gradient(45deg,#f3e6cb 0 12px,#f0e2c4 12px 24px);
    overflow:hidden;
  }
  #app{display:flex;flex-direction:column;height:100vh}
  header{
    display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap;
    background:linear-gradient(#5b4632,#3f3123);color:#ffeccd;border-bottom:4px solid #2a2016;
    box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:5;
  }
  header h1{font-size:18px;margin:0 12px 0 0;letter-spacing:1px;text-shadow:0 2px 0 #000}
  .stat{background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.14);border-radius:10px;padding:4px 10px;font-weight:bold;font-size:14px;white-space:nowrap}
  .stat small{opacity:.7;font-weight:normal}
  .grow{flex:1}
  button{
    font-family:inherit;font-weight:bold;cursor:pointer;color:#3a2c1d;
    background:linear-gradient(#fbe3ad,#e3c079);border:2px solid #8a6a36;border-radius:9px;
    padding:6px 10px;box-shadow:0 2px 0 #8a6a36;font-size:13px;
  }
  button:hover{filter:brightness(1.06)}
  button:active{transform:translateY(2px);box-shadow:none}
  button:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
  button.dark{background:linear-gradient(#6d5639,#4b3a26);color:#ffe9c0;border-color:#2a2016;box-shadow:0 2px 0 #2a2016}
  button.go{background:linear-gradient(#a8d98a,#6fae52);border-color:#3f6a2c;box-shadow:0 2px 0 #3f6a2c}
  button.bad{background:linear-gradient(#f0a5a5,#cf6b6b);border-color:#8a3636;box-shadow:0 2px 0 #8a3636}
  main{display:flex;flex:1;min-height:0}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;padding:8px;min-width:0}
  canvas{border-radius:14px;border:6px solid #4a3a26;box-shadow:var(--shadow);max-width:100%;max-height:100%;image-rendering:auto;cursor:crosshair}
  aside{
    width:400px;flex:none;background:linear-gradient(var(--parch),var(--parch2));border-left:5px solid #4a3a26;
    display:flex;flex-direction:column;min-height:0;
  }
  .tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:rgba(0,0,0,.06);border-bottom:2px solid var(--line)}
  .tabs button{padding:5px 9px;font-size:12px}
  .tabs button.on{background:linear-gradient(#f6d79a,#d9ab54);box-shadow:inset 0 0 0 2px #fff6}
  .pane{flex:1;overflow:auto;padding:10px}
  .pane::-webkit-scrollbar{width:10px}
  .pane::-webkit-scrollbar-thumb{background:#bfa470;border-radius:8px}
  h3{margin:4px 0 8px;font-size:15px;border-bottom:2px dashed var(--line);padding-bottom:4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(114px,1fr));gap:8px}
  .card{
    background:linear-gradient(#fffaef,#f2e6cd);border:2px solid var(--line);border-radius:12px;
    padding:7px;text-align:center;position:relative;box-shadow:0 2px 0 #cbb489;
  }
  .card.locked{opacity:.5;filter:grayscale(.7)}
  .card.sel{outline:3px solid var(--gold);outline-offset:1px}
  .card .emo{font-size:26px;line-height:1.1}
  .card .nm{font-size:11px;font-weight:bold;height:26px;display:flex;align-items:center;justify-content:center}
  .card .pr{font-size:11px;color:#6b5636}
  .card .lv{position:absolute;top:3px;right:4px;background:var(--gold);color:#fff;border-radius:6px;font-size:10px;padding:0 4px;font-weight:bold}
  .card .inv{position:absolute;top:3px;left:4px;background:var(--leaf);color:#fff;border-radius:6px;font-size:10px;padding:0 4px;font-weight:bold}
  .row{display:flex;gap:6px;align-items:center;margin:4px 0;font-size:12px}
  .bar{height:8px;background:#d9c69c;border-radius:6px;overflow:hidden;flex:1;border:1px solid #b79f71}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#7fae4e,#c8d24e)}
  .up{display:flex;justify-content:space-between;align-items:center;gap:6px;background:#fffaef;border:2px solid var(--line);border-radius:10px;padding:6px 8px;margin-bottom:6px}
  .up b{font-size:12px} .up p{margin:2px 0 0;font-size:11px;color:#6b5636;max-width:215px}
  .tag{display:inline-block;background:#e6d6b0;border:1px solid var(--line);border-radius:6px;padding:0 5px;font-size:10px;margin:2px 2px 0 0}
  #log{height:84px;overflow:auto;font-size:11px;background:rgba(0,0,0,.05);border-top:2px solid var(--line);padding:6px 10px}
  #log div{margin:1px 0}
  .toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(30,22,14,.9);color:#ffe9c0;padding:8px 16px;border-radius:10px;font-weight:bold;pointer-events:none;opacity:0;transition:.3s;z-index:9}
  .toast.on{opacity:1}
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,14,8,.68);z-index:8}
  #overlay .box{background:linear-gradient(var(--parch),var(--parch2));border:5px solid #4a3a26;border-radius:16px;padding:22px 26px;text-align:center;max-width:460px;box-shadow:var(--shadow)}
  #overlay h2{margin:0 0 8px}
  .mini{font-size:11px;color:#6b5636}
  textarea{width:100%;height:120px;font-size:10px;font-family:monospace;border:2px solid var(--line);border-radius:8px;padding:6px;background:#fffaef}
  .guideSearch{width:100%;padding:7px 9px;border:2px solid var(--line);border-radius:9px;background:#fffaef;font:inherit;color:var(--ink);margin:4px 0 8px}
  .guideCard{background:linear-gradient(#fffaef,#f2e6cd);border:2px solid var(--line);border-radius:12px;padding:8px;margin-bottom:7px;box-shadow:0 2px 0 #cbb489}
  .guideCard .top{display:flex;align-items:center;gap:7px}
  .guideCard .icon{font-size:27px;line-height:1}
  .guideCard .title{font-size:13px;font-weight:bold}
  .guideCard .sub{font-size:10px;color:#6b5636}
  .guideGrid{display:grid;grid-template-columns:1fr;gap:7px}
  .guideTag{display:inline-block;background:#e6d6b0;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:10px;margin:2px 2px 0 0}
  .guideCard p{font-size:11px;margin:5px 0;color:#4f4030;line-height:1.3}
  .guideBtn{padding:4px 7px;font-size:10px;margin-top:4px}
  .contract{background:linear-gradient(#fffaef,#f2e6cd);border:2px solid var(--line);border-radius:12px;padding:8px;margin-bottom:7px;box-shadow:0 2px 0 #cbb489}
  .contract .ctop{display:flex;justify-content:space-between;gap:6px;align-items:center}
  .contract .ctitle{font-size:12px;font-weight:bold}
  .contract .reward{font-size:10px;color:#6b5636}
  .progressWrap{display:flex;gap:6px;align-items:center;font-size:10px;margin-top:5px}
  .choiceGrid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
  .choice{background:linear-gradient(#fffaef,#f2e6cd);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:left;box-shadow:0 2px 0 #cbb489}
  .choice h4{margin:0 0 4px;font-size:13px}
  .choice p{margin:3px 0;font-size:11px;color:#5d4b38;line-height:1.3}
  .choice .trade{font-size:10px;color:#6b5636}
  .special{display:inline-block;background:#ead5ff;border:1px solid #a77bc8;border-radius:7px;padding:1px 5px;font-size:10px;margin-top:3px;color:#5f3f7a}
  .dangerBox{background:#fff0e8;border:2px solid #b86a4d;border-radius:10px;padding:7px;margin:6px 0}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🏰 WAYFARER KINGDOMS</h1>
    <div class="stat">🪙 <span id="sCoins">0</span></div>
    <div class="stat">💎 <span id="sGems">0</span></div>
    <div class="stat">❤️ <span id="sLives">20</span></div>
    <div class="stat"><small>Realm</small> <span id="sSet">1</span> · <small>Lv</small> <span id="sLevel">1</span></div>
    <div class="stat"><small>Wave</small> <span id="sWave">0/0</span></div>
    <div class="stat" id="sField">📦 Field</div>
    <div class="stat" id="sTheme">Isle</div>
    <div class="grow"></div>
    <button id="btnStart" class="go">▶ Start Wave</button>
    <button id="btnSpeed" class="dark">⏩ 1×</button>
    <button id="btnPause" class="dark">⏸</button>
    <button id="btnReturn" class="dark" title="Recall every placed tower to your inventory">📦 Recall All</button>
  </header>
  <main>
    <div id="stage">
      <canvas id="cv" width="768" height="768"></canvas>
      <div class="toast" id="toast"></div>
      <div id="overlay"><div class="box" id="obox"></div></div>
    </div>
    <aside>
      <div class="tabs" id="tabs"></div>
      <div class="pane" id="pane"></div>
      <div id="log"></div>
    </aside>
  </main>
</div>
<input type="file" id="fileIn" accept="application/json" style="display:none" />
<script>
/* ============================================================
   WAYFARER KINGDOMS — single file tower defense
   ============================================================ */
const GRID=16, CELL=48, W=GRID*CELL;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const fmt=n=>n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e4?(n/1e3).toFixed(1)+'k':Math.floor(n).toLocaleString();
/* ---------- THEMES ---------- */
const THEMES=[
 {name:'Emerald Isle',ground:'#7ec26a',ground2:'#6fb25d',edge:'#3f7a3c',path:'#e7cf94',path2:'#d8bb78',pathEdge:'#a98a4f',border:'#4fa3c7',sky:'#bfe4f2',deco:['🌴','🌺','🐚','🪸','🦜'],decoRate:.08},
 {name:'Frostpeak Mountain',ground:'#dfe9f2',ground2:'#cbd8e6',edge:'#8fa3b8',path:'#9aa7b5',path2:'#8996a6',pathEdge:'#66707c',border:'#f3f8ff',sky:'#e9f2fb',deco:['🏔️','🌲','❄️','🪨','🦌'],decoRate:.09},
 {name:'Ashfall Volcano',ground:'#4b3a3a',ground2:'#3f3030',edge:'#241a1a',path:'#8d3b22',path2:'#76301b',pathEdge:'#e06a2a',border:'#1d1414',sky:'#5d2c22',deco:['🌋','🔥','🪨','💀','🕯️'],decoRate:.08},
 {name:'Whisperwood',ground:'#4e7a46',ground2:'#436c3d',edge:'#2c4a2a',path:'#6d5238',path2:'#5d452f',pathEdge:'#8e6c46',border:'#2f4a2c',sky:'#8fbf7f',deco:['🌳','🍄','🦊','🌿','🪵'],decoRate:.11},
 {name:'Sunscorch Dunes',ground:'#e9cf92',ground2:'#ddc082',edge:'#b79a5c',path:'#c8a463',path2:'#b8934f',pathEdge:'#8e6f38',border:'#f2e0ad',sky:'#ffe9b0',deco:['🌵','🏜️','🦂','🐫','🏺'],decoRate:.07},
 {name:'Coral Shallows',ground:'#6fc6c0',ground2:'#5fb6b1',edge:'#2f7c79',path:'#f0e0b6',path2:'#e0cfa0',pathEdge:'#b79a62',border:'#3aa0c4',sky:'#c5f0ec',deco:['🐠','🪼','🐙','🐚','🫧'],decoRate:.1},
 {name:'Obsidian Wastes',ground:'#3b3550',ground2:'#332e46',edge:'#1d1a2b',path:'#5b4d78',path2:'#4d4166',pathEdge:'#9a7fd6',border:'#241f36',sky:'#2a2440',deco:['🔮','🌑','🪄','☄️','👁️'],decoRate:.07},
 {name:'Goldleaf Highlands',ground:'#c8a94f',ground2:'#b89a43',edge:'#8a7230',path:'#8a5f38',path2:'#77502f',pathEdge:'#d4a45c',border:'#6f5a26',sky:'#f2dd9a',deco:['🍁','🌾','🦅','🪨','⛰️'],decoRate:.1}
];
/* ---------- TOWER GUIDE ---------- */
const TOWER_HELP={
  single:{how:'Rapid single-target physical shots. It keeps firing at one enemy and is reliable against ordinary foes.',best:'Best for steady damage against normal enemies and fast targets that are not heavily armored.',watch:'Physical damage is reduced by Armor and can be dodged by Phantoms. It does not hit groups.',tip:'A Marksman gets especially good value when you need dependable damage without relying on splash or status effects.'},
  splash:{how:'Fires a physical shell that explodes on impact, damaging nearby enemies as well as the main target.',best:'Excellent against Swarmlings and packed groups. Place it where the road bends or enemies bunch together.',watch:'The splash tower fires much more slowly than Marksmen, and Physical damage struggles into Armored foes.',tip:'Do not judge it by single-target damage; its real value is how many enemies each shell can hit.'},
  slow:{how:'Shoots an elemental projectile that applies a strong movement slow for a short time.',best:'Great for dangerous fast enemies, bosses, and long road sections where keeping enemies in range matters.',watch:'Its base damage is low. It is strongest when the rest of your defence can exploit the extra time created by the slow.',tip:'Slow stacks with repeated hits, but the main benefit is control rather than raw DPS.'},
  poison:{how:'Deals elemental damage and applies a damage-over-time poison effect.',best:'Very useful against high-health enemies and Regenerators because active poison prevents their regeneration.',watch:'Damage arrives over time, so it is less explosive than Marksman or Bombard against tiny enemies.',tip:'Poison is one of the best answers to Regenerators; combine it with another damage source for the finishing blow.'},
  chain:{how:'Strikes a target with Arcane lightning, then jumps to nearby enemies. Base Stormcallers hit 3 enemies total; the second target takes 75% of the first hit and the third takes 75% of the second.',best:'Excellent when several enemies travel close together. One shot can damage a whole cluster without needing a projectile to travel between them.',watch:'Warded enemies strongly resist Arcane damage. The chains also need enemies close enough to each other to bounce.',tip:'Stormcaller = chain lightning. Think “anti-pack damage that also reaches multiple lanes of the same road,” not a normal single-target shooter.'},
  sniper:{how:'Long-range Physical shot with very high per-hit damage. It attacks slowly but can land enormous hits and crit.',best:'Excellent for bosses, elites, and exposed enemies far down the road. Its huge range lets it cover awkward parts of the map.',watch:'Slow attack speed means it can waste damage overkilling tiny enemies, and Physical counters like Armor and Phantom dodge still matter.',tip:'Put Longshots where their range can cover a large portion of the path rather than hiding them in a corner.'},
  support:{how:'Does not attack. It creates an aura around itself that boosts nearby towers: more damage and faster firing.',best:'Best in dense defensive clusters where several strong towers can stand inside its aura.',watch:'Its value depends on positioning and nearby allies. Too far away from other towers means little benefit.',tip:'A Bannerman can be stronger than another attacker when several good towers are already grouped around it.'},
  income:{how:'Does not attack. It periodically generates coins while it remains on the field.',best:'Best on easier waves or when you can afford to sacrifice immediate damage for stronger future economy.',watch:'Every Coiner takes a build slot that could have been an attacker, so greed can make the current wave harder.',tip:'Think of Coiner as an investment tower: the earlier it starts earning, the more time it has to pay itself back.'},
  tesla:{how:'Very fast short-range Arcane zap. Each attack can jump to multiple nearby enemies, but it reaches a shorter distance than Stormcaller.',best:'Excellent in tight choke points where many enemies pass close to the tower.',watch:'Its range is short and Warded enemies resist Arcane damage.',tip:'Arcanist is the close-range lightning specialist; Stormcaller is the longer-range chain specialist.'},
  flame:{how:'Continuously attacks every enemy inside its short range with elemental fire and applies a burn damage-over-time effect.',best:'Excellent against tightly packed enemies and Regenerators because burn shuts off regeneration while active.',watch:'Very short range means placement matters a lot. It cannot contribute much from across the map.',tip:'Pyre wants a corner, junction, or other location where enemies stay close to it for a long time.'}
};
function towerHelp(t){ return TOWER_HELP[t.role]||{how:t.desc,best:'Use it according to its displayed stats and role.',watch:'Watch its damage type and range.',tip:'Higher Card Levels improve this tower type permanently.'}; }
function showTowerGuide(id){
  const t=TW[id], h=towerHelp(t), r=DCLASS[t.role], spec=SPECS[t.role]||[];
  const hits=t.role==='chain'?3:t.role==='tesla'?2:0;
  let extra='';
  if(hits) extra+=`<span class="guideTag">⚡ ${hits} targets base</span>`;
  if(t.role==='chain') extra+='<span class="guideTag">75% damage per jump</span>';
  if(t.role==='flame') extra+='<span class="guideTag">Area attack + burn</span>';
  if(t.role==='slow') extra+='<span class="guideTag">30% base slow</span>';
  if(t.role==='poison') extra+='<span class="guideTag">Damage over time</span>';
  if(t.role==='support') extra+='<span class="guideTag">Aura support</span>';
  if(t.role==='income') extra+='<span class="guideTag">Generates coins</span>';
  overlay(`<h2>${t.emoji} ${t.name}</h2>
    <p><b>${h.how}</b></p>
    <div>${extra}<span class="guideTag">${CLASSNAME[r]}</span><span class="guideTag">Tier ${t.tier}</span><span class="guideTag">Range ${t.rng.toFixed(2)}</span>${t.cd?`<span class="guideTag">${(1/t.cd).toFixed(2)}/s base</span>`:''}</div>
    <h3>What it is good at</h3><p>${h.best}</p>
    <h3>What to watch for</h3><p>${h.watch}</p>
    <p>💡 <b>Tip:</b> ${h.tip}</p>
    <h3>Specializations</h3>
    ${spec.map((x,i)=>`<div class="mini"><b>${x.n}</b> — ${x.d}</div>`).join('')}
    <p class="mini">Card Lv ${cardLv(id)} boosts the whole tower type. Personal levels and specializations belong to an individual field card.</p>
    <p><button class="go" onclick="closeOverlay()">Close</button></p>`);
}
window.showTowerGuide=showTowerGuide;
/* ---------- TOWER CATALOG (100) ---------- */
const ROLES=[
 {k:'single', label:'Marksman', dmg:10, rng:2.6, cd:.65, desc:'Fast single-target shots.'},
 {k:'splash', label:'Bombard',  dmg:22, rng:2.4, cd:1.5, desc:'Explodes for area damage.'},
 {k:'slow',   label:'Frostcaller',dmg:6, rng:2.4, cd:.9, desc:'Chills foes, slowing them.'},
 {k:'poison', label:'Venomist', dmg:5,  rng:2.5, cd:1.1, desc:'Applies stacking poison.'},
 {k:'chain',  label:'Stormcaller',dmg:12,rng:2.7,cd:1.2, desc:'Lightning arcs to 3 foes.'},
 {k:'sniper', label:'Longshot', dmg:46, rng:5.2, cd:2.2, desc:'Huge range, huge hits, crits.'},
 {k:'support',label:'Bannerman',dmg:0,  rng:2.6, cd:0,   desc:'Aura: +damage & +rate nearby.'},
 {k:'income', label:'Coiner',   dmg:0,  rng:1,   cd:0,   desc:'Mints coins every second.'},
 {k:'tesla',  label:'Arcanist', dmg:9,  rng:1.9, cd:.35, desc:'Very fast short-range zaps.'},
 {k:'flame',  label:'Pyre',     dmg:7,  rng:1.8, cd:.25, desc:'Scorches everything close, burns.'}
];
const EMOJI=[
 ['🏹','💣','❄️','🧪','⚡','🎯','🚩','🪙','🔮','🔥'],
 ['🗡️','🧨','🧊','☠️','🌩️','🔭','📯','💰','✨','🕯️'],
 ['🪃','🎆','🌨️','🍄','🌀','🛰️','🥁','🏦','🪄','🌶️'],
 ['🔫','🗿','🐧','🕷️','🌪️','🦅','🎺','💳','🧿','☄️'],
 ['⚔️','⛏️','🧙','🐍','🔌','🛸','🎖️','💎','🌌','🐉'],
 ['🛡️','💥','🥶','🧫','🌐','👁️','👑','🏛️','🌠','🌋'],
 ['🪓','🚀','🧛','🦂','🔋','🦉','📣','⚖️','🪬','😈'],
 ['🏺','☢️','🌬️','🧟','🧲','🦇','🎻','🧧','🪞','🔆'],
 ['🦾','🌑','🗻','🪱','⚙️','🌟','🎼','🏵️','🕳️','💫'],
 ['🐺','🌞','🧜','🦠','🛞','🦇','🎇','🫅','🪐','🐲']
];
const PREFIX=['Oaken','Iron','Silver','Runed','Storm','Radiant','Eclipse','Dragon','Astral','Eternal'];
const TOWERS=[];
for(let t=1;t<=10;t++){
  for(let r=0;r<10;r++){
    const role=ROLES[r];
    const id='t'+t+'_'+r;
    const price=Math.round(60*Math.pow(2.35,t-1)*(role.k==='income'?1.5:role.k==='support'?1.3:role.k==='sniper'?1.25:1)/5)*5;
    TOWERS.push({
      id, tier:t, role:role.k, name:PREFIX[t-1]+' '+role.label, emoji:EMOJI[t-1][r],
      desc:role.desc, price,
      dmg:role.dmg*Math.pow(1.95,t-1), rng:role.rng+t*0.12, cd:role.cd,
      unlockSet: t===1 ? (r<6?1:2) : t
    });
  }
}
const TW=Object.fromEntries(TOWERS.map(t=>[t.id,t]));
// Build cost rises with every permanent card level of that tower type.
function buyPrice(id){ return Math.round(TW[id].price*Math.pow(1.34,cardLv(id)-1)/5)*5; }
/* ---------- DAMAGE CLASSES & FOE TYPES ---------- */
const DCLASS={single:'phys',sniper:'phys',splash:'phys',chain:'arc',tesla:'arc',support:'arc',income:'arc',poison:'elem',flame:'elem',slow:'elem'};
const CLASSNAME={phys:'Physical',arc:'Arcane',elem:'Elemental'};
// res = fraction of damage ignored from that class. dodge = chance to evade physical shots.
const KINDS=[
 {tag:'',          w:30, hpMul:1,   spd:1,    armor:.05, min:1},
 {tag:'Swift',     w:16, hpMul:.9,  spd:2.15, armor:0,   dodge:.15, min:1, mark:'#8fd8ff'},

function pickKind(gLv,w){
  const pool=KINDS.filter(k=>gLv+w*0.5>=k.min);
  const medium=new Set(['Armored','Warded','Phantom','Healer','Regenerator']);
  let tot=0;
  const weighted=pool.map(k=>{
    let mul=1;
    if(medium.has(k.tag)) mul=1.75;
    else if(k.tag==='') mul=.62;
    else if(k.tag==='Swift') mul=.85;
    else if(k.tag==='Swarmling') mul=.75;
    else if(k.tag==='Juggernaut') mul=.50;
    const wt=k.w*mul; tot+=wt; return [k,wt];
  });
  let r=Math.random()*tot;
  for(const [k,wt] of weighted){ r-=wt; if(r<=0)return k; }
  return pool[pool.length-1]||KINDS[0];
}

/* ---------- PATH GENERATION (zig-zag straight lines) ---------- */
function genPath(seedNum){
  let seed=seedNum>>>0;
  const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
  const rows=[]; let y=1+Math.floor(rnd()*2);
  while(y<GRID-1){ rows.push(y); y+=2+Math.floor(rnd()*3); }
  if(rows.length<3) rows.push(GRID-2);
  const pts=[]; let dir=1;
  for(let i=0;i<rows.length;i++){
    const ry=rows[i];
    const startX = dir===1 ? (i===0?0:pts[pts.length-1].x) : (i===0?GRID-1:pts[pts.length-1].x);
    let endX;
    if(i===rows.length-1) endX = dir===1?GRID-1:0;
    else endX = dir===1 ? GRID-1-Math.floor(rnd()*3) : Math.floor(rnd()*3);
    pts.push({x:startX,y:ry});
    pts.push({x:endX,y:ry});
    dir*=-1;
  }
  // stitch into cell list
  const cells=[]; const key=(x,y)=>x+','+y; const set=new Set();
  const add=(x,y)=>{ if(!set.has(key(x,y))){set.add(key(x,y)); cells.push({x,y});} };
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1];
    if(a.y===b.y){ const s=Math.sign(b.x-a.x)||1; for(let x=a.x;;x+=s){ add(x,a.y); if(x===b.x)break; } }
    else { const s=Math.sign(b.y-a.y)||1; for(let yy=a.y;;yy+=s){ add(a.x,yy); if(yy===b.y)break; } }
  }
  // ensure entry from left edge and exit to right/left edge
  const first=cells[0], last=cells[cells.length-1];
  const wps=cells.map(c=>({x:c.x*CELL+CELL/2,y:c.y*CELL+CELL/2}));
  wps.unshift({x:first.x*CELL+CELL/2 - (first.x===0?CELL:0), y:first.y*CELL+CELL/2});
  wps.push({x:last.x*CELL+CELL/2 + (last.x===GRID-1?CELL:-CELL), y:last.y*CELL+CELL/2});
  return {cells,set,wps};
}

/* ---------- STATS ---------- */
function towerStats(t){
  const base=TW[t.id];
  const cl=cardLv(t.id), il=t.lv||0;
  const specMul = 1 + (t.spec.dmg||0)*0.25;
  let dmg=base.dmg*(1+0.22*(cl-1))*(1+0.16*il)*specMul*(1+gl('aura_dmg')*0.06);
  let rng=(base.rng+(t.spec.rng||0)*0.45)*(1+0.04*gl('aura_rng'))*(1+0.03*il);
  let cd=base.cd/((1+0.05*(cl-1))*(1+0.05*il)*(1+0.05*gl('aura_rate'))*(1+(t.spec.rate||0)*0.18));
  // support auras
  let buff=0;
  for(const o of R.towers){
    if(o===t||TW[o.id].role!=='support')continue;
    const or=towerStats0(o).rng;
    if(Math.hypot(o.cx-t.cx,o.cy-t.cy)<=or) buff+=0.18+0.05*(cardLv(o.id)-1)+0.06*(o.lv||0);
  }
  dmg*=1+buff; cd/=1+buff*0.5;
  // Overcrowding: identical strategies get diminishing returns
  const role=base.role;
  let sameRole=0, sameId=0;
  for(const o of R.towers){ if(TW[o.id].role===role) sameRole++; if(o.id===t.id) sameId++; }
  const sat=Math.max(0.3, Math.pow(0.87, Math.max(0,sameRole-3)) * Math.pow(0.95, Math.max(0,sameId-2)));
  dmg*=sat;
  return {dmg,rng,cd,buff,sat,sameRole};
}
function towerStats0(t){ const b=TW[t.id]; return {rng:(b.rng+(t.spec.rng||0)*0.45)*(1+0.04*gl('aura_rng'))}; }
function enemyHP(levelGlobal,waveIdx,kind){
  const base=30*Math.pow(1.62,levelGlobal-1)*(1+waveIdx*0.28);
  return Math.round(base*kind.hpMul);
}
/* ---------- WAVE BUILDING ---------- */
function makeWave(w){
  const fam=familyOf(), gLv=(S.set-1)*5+S.level;
  const n=8+w*3+Math.floor(S.level*2.2);
  const q=[];
  const boss = w===R.waves-1;
  const gap = 0.52/Math.min(2.8,1+w*0.14);
  let t=0, made=0, i=0;
  while(made<n){
    const k=pickKind(gLv,w);
    const kind=Object.assign({},k,{e:fam.e[(i+KINDS.indexOf(k))%fam.e.length]});
    const pack=k.pack||1;
    for(let p=0;p<pack;p++){
      q.push({kind,hp:enemyHP(gLv,w,kind),t:t+p*0.14,mini:!!k.mini});
      made++;
    }
    t+=gap*(k.mini?2.2:1); i++;
  }
  // mid-wave elites: tanks and speedsters with real health
  const elites=1+Math.floor(w/2);
  for(let j=0;j<elites;j++){
    const tank = j%2===0;
    const k = tank
      ? {tag:'Warlord',e:fam.e[j%fam.e.length],hpMul:9+S.level*1.6,spd:0.62,armor:0.55,res:{phys:.3,arc:.25},mark:'#ff9d4d',mini:true}
      : {tag:'Courier',e:fam.e[(j+2)%fam.e.length],hpMul:3.6+S.level*0.7,spd:2.4,armor:0.1,dodge:.3,mark:'#8fd8ff',mini:true};
    q.push({kind:k,hp:enemyHP(gLv,w,k),t:t*(0.25+0.6*j/Math.max(1,elites))+1.0,mini:true});
  }
  if(boss){
    const k={e:fam.boss,hpMul:26+S.level*6+S.set*4,spd:0.58,armor:0.55,res:{phys:.35,arc:.35,elem:.2},tag:'BOSS',mark:'#ff6b6b'};
    q.push({kind:k,hp:enemyHP(gLv,w,k),t:t+2.2,boss:true});
    for(let g=0;g<3;g++){
      const gk={e:fam.e[g%fam.e.length],hpMul:6+S.level*1.2,spd:1.0,armor:0.4,res:{elem:.3},tag:'Guard',mark:'#e0b060',mini:true};
      q.push({kind:gk,hp:enemyHP(gLv,w,gk),t:t+2.2+0.5*g,mini:true});
    }
  }
  q.sort((a,b)=>a.t-b.t);
  return q;
}
/* ---------- GAME LOOP ---------- */
let last=performance.now();
function loop(now){
  const dtr=Math.min(.05,(now-last)/1000); last=now;
  if(R&&!R.paused){ const dt=dtr*R.speed; if(R.running) step(dt); R.time+=dt; S.playtime+=dtr; }
  draw();
  requestAnimationFrame(loop);
}
function step(dt){
  // spawn
  if(R.spawnQ.length){
    R.spawnT+=dt;
    while(R.spawnQ.length && R.spawnQ[0].t<=R.spawnT){
      const s=R.spawnQ.shift();
      R.enemies.push({x:R.path.wps[0].x,y:R.path.wps[0].y,wp:1,hp:s.hp,max:s.hp,kind:s.kind,
        slow:0,slowT:0,poison:0,poisonT:0,burn:0,burnT:0,boss:!!s.boss,mini:!!s.mini,healT:0});
    }
  }
  // enemies
  for(const e of R.enemies){
    if(e.slowT>0){e.slowT-=dt; if(e.slowT<=0)e.slow=0;}
    if(e.poisonT>0){e.poisonT-=dt; e.hp-=e.poison*dt; if(e.poisonT<=0)e.poison=0;}
    if(e.burnT>0){e.burnT-=dt; e.hp-=e.burn*dt; if(e.burnT<=0)e.burn=0;}
    if(e.kind.regen && e.poisonT<=0 && e.burnT<=0){ e.hp=Math.min(e.max,e.hp+e.max*e.kind.regen*dt); }
    if(e.kind.tag==='Healer'){ e.healT-=dt; if(e.healT<=0){e.healT=2; for(const o of R.enemies){ if(o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<110) o.hp=Math.min(o.max,o.hp+o.max*0.03); } } }
    const tgt=R.path.wps[e.wp];
    if(!tgt){ leak(e); e.dead=true; continue; }
    const spd=(52+e.kind.spd*22)*e.kind.spd*(1-e.slow);
    const dx=tgt.x-e.x, dy=tgt.y-e.y, d=Math.hypot(dx,dy);
    if(d<spd*dt){ e.x=tgt.x; e.y=tgt.y; e.wp++; }
    else { e.x+=dx/d*spd*dt; e.y+=dy/d*spd*dt; }
  }
  // towers fire
  for(const t of R.towers){
    const st=towerStats(t), role=TW[t.id].role;
    if(role==='income'){ t.acc=(t.acc||0)+dt; const rate=1;
      if(t.acc>=rate){ t.acc-=rate; const g=Math.round((6*Math.pow(2.1,TW[t.id].tier-1))*(1+0.3*(cardLv(t.id)-1))*(1+0.25*(t.lv||0))); gain(g,0); fx(t.cx*CELL+CELL/2,t.cy*CELL+CELL/2,'+'+g,'#f0c36a'); }
      continue; }
    if(role==='support') continue;
    t.cool=(t.cool||0)-dt;
    if(t.cool>0) continue;
    const px=t.cx*CELL+CELL/2, py=t.cy*CELL+CELL/2, rr=st.rng*CELL;
    let best=null,bestP=-1;
    for(const e of R.enemies){ if(e.dead)continue; const d=Math.hypot(e.x-px,e.y-py); if(d<=rr){ const p=e.wp*1000-d; if(p>bestP){bestP=p;best=e;} } }
    if(!best) continue;
    t.cool=st.cd; t.ang=Math.atan2(best.y-py,best.x-px);
    fire(t,st,best,px,py,rr);
  }
  // projectiles
  for(const p of R.shots){
    if(p.target&&!p.target.dead){ p.tx=p.target.x; p.ty=p.target.y; }
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
    if(d<p.spd*dt){ hit(p); p.dead=true; }
    else { p.x+=dx/d*p.spd*dt; p.y+=dy/d*p.spd*dt; }
    p.life=(p.life||0)+dt; if(p.life>3)p.dead=true;
  }
  R.shots=R.shots.filter(p=>!p.dead);
  // deaths
  for(const e of R.enemies){ if(e.dead)continue; if(e.hp<=0){ e.dead=true; kill(e); } }
  R.enemies=R.enemies.filter(e=>!e.dead);
  // fx

function fire(t,st,target,px,py,rr){
  const base=TW[t.id], role=base.role;
  const critC=gl('crit')*0.03+(t.spec.crit||0)*0.05;
  let dmg=st.dmg*(Math.random()<critC?3:1);
  const col={single:'#ffe9a8',splash:'#ff9d4d',slow:'#9fe6ff',poison:'#a4e05a',chain:'#d9b3ff',sniper:'#ffd0d0',tesla:'#bfe9ff',flame:'#ff8a3d'}[role]||'#fff';
  if(role==='chain'||role==='tesla'){
    const hits=[target]; const n=(role==='chain'?3:2)+(t.spec.chain||0);
    for(const e of R.enemies){ if(hits.length>=n)break; if(e===target||e.dead)continue; if(Math.hypot(e.x-target.x,e.y-target.y)<CELL*2.2) hits.push(e); }
    hits.forEach((e,i)=>{ damage(e,dmg*Math.pow(0.75,i),t); });
    R.fx.push({t:.15,type:'beam',pts:[{x:px,y:py},...hits.map(h=>({x:h.x,y:h.y}))],c:col});
    return;
  }
  if(role==='flame'){
    for(const e of R.enemies){ if(Math.hypot(e.x-px,e.y-py)<=rr){ damage(e,dmg,t); e.burn=Math.max(e.burn,dmg*0.5); e.burnT=2.2; } }
    R.fx.push({t:.12,type:'ring',x:px,y:py,r:rr,c:col}); return;
  }
  if(role==='sniper'){ damage(target,dmg,t); R.fx.push({t:.12,type:'beam',pts:[{x:px,y:py},{x:target.x,y:target.y}],c:col}); return; }
  R.shots.push({x:px,y:py,tx:target.x,ty:target.y,target,spd:role==='splash'?330:520,dmg,role,c:col,src:t,
    splash:(1.05+(t.spec.splash||0)*0.3)*CELL});
}
function hit(p){
  const t=p.src;
  if(p.role==='splash'){
    for(const e of R.enemies){ if(Math.hypot(e.x-p.x,e.y-p.y)<=p.splash) damage(e,p.dmg*(e===p.target?1:0.7),t); }
    R.fx.push({t:.18,type:'ring',x:p.x,y:p.y,r:p.splash,c:'#ff9d4d'});
  } else if(p.target&&!p.target.dead){
    damage(p.target,p.dmg,t);
    if(p.role==='slow'){ const s=clamp(0.30+0.05*(t.lv||0)+(t.spec.slow||0)*0.08,0,0.8); p.target.slow=Math.max(p.target.slow,s); p.target.slowT=1.8; }
    if(p.role==='poison'){ p.target.poison=Math.max(p.target.poison,p.dmg*(0.8+(t.spec.pois||0)*0.4)); p.target.poisonT=3; }
  }
}
function damage(e,d,t){
  const cls=DCLASS[TW[t.id].role]||'phys';
  if(e.kind.dodge && cls==='phys' && Math.random()<e.kind.dodge){ fx(e.x,e.y,'miss','#cfd8e3'); return; }
  const armor=Math.max(0,e.kind.armor-(gl('pierce')*0.08));
  const res=(e.kind.res&&e.kind.res[cls])||0;
  e.hp-=d*(1-armor)*(1-res);

/* ---------- RENDER CANVAS ---------- */
function noise(x,y){ const n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); }
function draw(){
  if(!R) return;
  const th=themeOf();
  ctx.clearRect(0,0,W,W);
  // ground
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    const n=noise(x+S.set*3,y);
    ctx.fillStyle = n>0.55? th.ground2: th.ground;
    ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
    if(n>0.86){ ctx.fillStyle='rgba(255,255,255,.06)'; ctx.fillRect(x*CELL,y*CELL,CELL,CELL); }
  }
  // border frame (water / cliffs / lava)
  ctx.strokeStyle=th.border; ctx.lineWidth=10; ctx.strokeRect(5,5,W-10,W-10);
  // decorations
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    if(R.path.set.has(x+','+y))continue;
    if(R.towers.some(t=>t.cx===x&&t.cy===y))continue;
    const n=noise(x*1.7+S.set*11,y*2.3);
    if(n<th.decoRate){ ctx.globalAlpha=.85; ctx.font='20px serif';
      ctx.fillText(th.deco[Math.floor(noise(y,x)*th.deco.length)%th.deco.length],x*CELL+CELL/2,y*CELL+CELL/2+2); ctx.globalAlpha=1; }
  }
  // path
  for(const c of R.path.cells){
    const x=c.x*CELL,y=c.y*CELL;
    ctx.fillStyle=(c.x+c.y)%2?th.path:th.path2;
    ctx.fillRect(x,y,CELL,CELL);
  }
  // path outline dashes
  ctx.strokeStyle=th.pathEdge; ctx.lineWidth=3;
  for(const c of R.path.cells){
    const x=c.x*CELL,y=c.y*CELL;
    const nb=(dx,dy)=>R.path.set.has((c.x+dx)+','+(c.y+dy));
    ctx.beginPath();
    if(!nb(0,-1)){ctx.moveTo(x,y+1.5);ctx.lineTo(x+CELL,y+1.5);}
    if(!nb(0,1)){ctx.moveTo(x,y+CELL-1.5);ctx.lineTo(x+CELL,y+CELL-1.5);}
    if(!nb(-1,0)){ctx.moveTo(x+1.5,y);ctx.lineTo(x+1.5,y+CELL);}
    if(!nb(1,0)){ctx.moveTo(x+CELL-1.5,y);ctx.lineTo(x+CELL-1.5,y+CELL);}
    ctx.stroke();
  }
  // start & end markers
  const a=R.path.cells[0], b=R.path.cells[R.path.cells.length-1];
  ctx.font='26px serif';
  ctx.fillText('🚪',a.x*CELL+CELL/2,a.y*CELL+CELL/2);
  ctx.fillText('🏰',b.x*CELL+CELL/2,b.y*CELL+CELL/2);
  // hover/placement preview
  if(R.hover&&R.sel){
    const {x,y}=R.hover, base=TW[R.sel];
    const ok=!R.path.set.has(x+','+y)&&!R.towers.some(t=>t.cx===x&&t.cy===y);
    const rr=(base.rng*(1+0.04*gl('aura_rng')))*CELL;
    ctx.fillStyle=ok?'rgba(255,255,255,.28)':'rgba(255,60,60,.32)';
    ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
    ctx.beginPath(); ctx.arc(x*CELL+CELL/2,y*CELL+CELL/2,rr,0,7);
    ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.10)'; ctx.fill();
  }
  // towers
  for(const t of R.towers){
    const x=t.cx*CELL, y=t.cy*CELL, st=towerStats(t);
    ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(x+CELL/2,y+CELL-8,16,7,0,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)'; roundRect(x+5,y+5,CELL-10,CELL-10,9); ctx.fill();
    ctx.strokeStyle=t===R.selTower?'#ffd76a':'rgba(0,0,0,.35)'; ctx.lineWidth=t===R.selTower?3:2; roundRect(x+5,y+5,CELL-10,CELL-10,9); ctx.stroke();
    ctx.font='26px serif'; ctx.fillText(TW[t.id].emoji,x+CELL/2,y+CELL/2+1);
    const lvl=cardLv(t.id)+(t.lv||0);
    ctx.font='bold 10px Verdana'; ctx.fillStyle='#2b2320';
    ctx.fillText('L'+lvl,x+CELL/2,y+CELL-7);
    if(st.buff>0){ ctx.strokeStyle='rgba(255,230,130,.85)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x+CELL/2,y+CELL/2,20,0,7); ctx.stroke(); }
  }
  if(R.selTower){ const st=towerStats(R.selTower);
    ctx.beginPath(); ctx.arc(R.selTower.cx*CELL+CELL/2,R.selTower.cy*CELL+CELL/2,st.rng*CELL,0,7);
    ctx.strokeStyle='rgba(255,215,106,.8)'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='rgba(255,215,106,.10)'; ctx.fill(); }
  // shots
  for(const p of R.shots){ ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.role==='splash'?6:4,0,7); ctx.fill(); }
  // enemies
  for(const e of R.enemies){
    const s=e.boss?38:e.mini?31:24;
    ctx.font=s+'px serif'; ctx.fillText(e.kind.e,e.x,e.y);
    const w=e.boss?46:e.mini?36:28;
    ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(e.x-w/2,e.y-s/2-9,w,5);
    ctx.fillStyle=e.hp/e.max>.5?'#7ede6a':e.hp/e.max>.25?'#f2d15a':'#e86b6b';
    ctx.fillRect(e.x-w/2,e.y-s/2-9,w*clamp(e.hp/e.max,0,1),5);
    if(e.kind.mark){ ctx.fillStyle=e.kind.mark; ctx.beginPath(); ctx.arc(e.x,e.y-s/2-14,3.5,0,7); ctx.fill(); }
    if(e.slow>0){ ctx.fillStyle='rgba(150,220,255,.45)'; ctx.beginPath(); ctx.arc(e.x,e.y,s*0.6,0,7); ctx.fill(); }
    if(e.poison>0){ ctx.fillStyle='rgba(140,220,90,.35)'; ctx.beginPath(); ctx.arc(e.x,e.y,s*0.5,0,7); ctx.fill(); }
    if(e.burn>0){ ctx.fillStyle='rgba(255,140,60,.30)'; ctx.beginPath(); ctx.arc(e.x,e.y,s*0.55,0,7); ctx.fill(); }
  }
  // fx
  for(const f of R.fx){
    if(f.type==='text'){ ctx.globalAlpha=clamp(f.t,0,1); ctx.font='bold 14px Verdana'; ctx.fillStyle=f.c;
      ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.lineWidth=3; ctx.strokeText(f.txt,f.x,f.y); ctx.fillText(f.txt,f.x,f.y); ctx.globalAlpha=1; }
    if(f.type==='ring'){ ctx.globalAlpha=clamp(f.t*5,0,1); ctx.strokeStyle=f.c; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.stroke(); ctx.globalAlpha=1; }
    if(f.type==='beam'){ ctx.globalAlpha=clamp(f.t*6,0,1); ctx.strokeStyle=f.c; ctx.lineWidth=3; ctx.beginPath();
      f.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke(); ctx.globalAlpha=1; }
  }
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
/* ---------- INPUT ---------- */
function cellFromEvent(ev){
  const r=cv.getBoundingClientRect();
  const x=Math.floor((ev.clientX-r.left)/r.width*GRID);
  const y=Math.floor((ev.clientY-r.top)/r.height*GRID);
  return {x:clamp(x,0,GRID-1),y:clamp(y,0,GRID-1)};
}
cv.addEventListener('mousemove',e=>{ R.hover=cellFromEvent(e); });

  if(e.key==='Escape'){R.sel=null;R.selTower=null;render();}
  if(e.key==='p'||e.key==='P') togglePause();
  if(e.key==='1'||e.key==='2'||e.key==='3'){ R.speed=+e.key; $('btnSpeed').textContent='⏩ '+R.speed+'×'; }

let curTab='shop';
const TABS=[['shop','🛒 Shop'],['inv','📦 Inventory'],['cards','⭐ Card Upgrades'],['guide','📖 Tower Guide'],['tower','🔧 Selected'],['glob','🏛️ Kingdom'],['save','💾 Save']];
function tab(t){ curTab=t; render(); }
window.tab=tab;
function render(){
  $('tabs').innerHTML=TABS.map(([k,l])=>`<button class="${k===curTab?'on':''}" onclick="tab('${k}')">${l}</button>`).join('');
  const p=$('pane');
  if(curTab==='shop') p.innerHTML=shopHTML();
  else if(curTab==='inv') p.innerHTML=invHTML();
  else if(curTab==='cards') p.innerHTML=cardsHTML();
  else if(curTab==='guide') p.innerHTML=guideHTML();
  else if(curTab==='tower') p.innerHTML=towerHTML();
  else if(curTab==='glob') p.innerHTML=globHTML();
  else p.innerHTML=saveHTML();
  sync();
}
function tcard(t,extra,cls){
  const locked=S.set<t.unlockSet && !(invCount(t.id)>0);
  const inv=invCount(t.id);
  return `<div class="card ${locked?'locked':''} ${R&&R.sel===t.id?'sel':''} ${cls||''}" onclick="${locked?'':`pick('${t.id}')`}">
    ${cardLv(t.id)>1?`<span class="lv">Lv${cardLv(t.id)}</span>`:''}
    ${inv?`<span class="inv">×${inv}</span>`:''}
    <div class="emo">${t.emoji}</div>
    <div class="nm">${t.name}</div>
    <div class="pr">${locked?'🔒 Realm '+t.unlockSet:(inv?'FREE (stock)':'🪙 '+fmt(buyPrice(t.id)))}</div>
    ${hasTypeDeploy(t.id)?'<div class="mini">⚔️ All-Card Deployment</div>':''}
    <button class="guideBtn" onclick="event.stopPropagation();showTowerGuide('${t.id}')">ℹ️ What does this do?</button>

/* ---------- INDEXEDDB ---------- */
let db=null;
function openDB(){
  return new Promise(res=>{
    try{
      const rq=indexedDB.open('wayfarer-kingdoms',2);
      rq.onupgradeneeded=()=>{
        if(!rq.result.objectStoreNames.contains('saves')) rq.result.createObjectStore('saves');
      };
      rq.onsuccess=()=>{db=rq.result;res(db);};
      rq.onerror=()=>{db=null;res(null);};
    }catch(e){db=null;res(null);}
  });
}
function snapshot(){
  syncInvCounts();
  if(R) S.field={
    towers:R.towers.map(t=>({
      id:t.id,cx:t.cx,cy:t.cy,uid:t.uid,lv:t.lv||0,spec:Object.assign({},t.spec),
      paid:t.paid,redeploy:!!t.redeploy
    })),
    wave:R.running?Math.max(0,R.wave-1):R.wave, waves:R.waves, speed:R.speed
  };
  return S;
}
let lastSave=0;
function save(force){
  const now=Date.now();
  if(!force && now-lastSave<900) return true;
  lastSave=now;
  snapshot();
  S.lastSavedAt=now;
  let json='';
  try{json=JSON.stringify(S);}catch(e){return false;}
  let ok=false;
  try{localStorage.setItem('wk-save',json);ok=true;}catch(e){}
  if(db){
    try{const tx=db.transaction('saves','readwrite');tx.objectStore('saves').put(JSON.parse(json),'main');ok=true;}catch(e){}
  }
  return ok;
}
function load(){
  return new Promise(res=>{
    let local=null;
    try{const l=localStorage.getItem('wk-save');local=l?JSON.parse(l):null;}catch(e){}
    if(!db){res(local);return;}
    try{
      const tx=db.transaction('saves','readonly');
      const rq=tx.objectStore('saves').get('main');
      rq.onsuccess=()=>{
        const idb=rq.result||null;
        if(!idb) return res(local);
        if(!local) return res(idb);
        res(Number(idb.lastSavedAt||0)>=Number(local.lastSavedAt||0)?idb:local);
      };
      rq.onerror=()=>res(local);
    }catch(e){res(local);}
  });
}

function step(dt){
  if(R.spawnQ.length){
    R.spawnT+=dt;
    while(R.spawnQ.length && R.spawnQ[0].t<=R.spawnT){
      const q=R.spawnQ.shift();
      R.enemies.push({x:R.path.wps[0].x,y:R.path.wps[0].y,wp:1,hp:q.hp,max:q.hp,kind:q.kind,
        slow:0,slowT:0,poison:0,poisonT:0,burn:0,burnT:0,boss:!!q.boss,mini:!!q.mini,healT:0});
    }
  }
  const enemyRegenExtra=wk5PathMult('enemyRegen',0);
  const enemySpeed=wk5PathMult('speedMult',1);
  for(const e of R.enemies){
    if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slow=0;}
    if(e.poisonT>0){e.poisonT-=dt;e.hp-=e.poison*dt;if(e.poisonT<=0)e.poison=0;}
    if(e.burnT>0){e.burnT-=dt;e.hp-=e.burn*dt;if(e.burnT<=0)e.burn=0;}
    const regen=(e.kind.regen||0)+enemyRegenExtra;
    if(regen>0&&e.poisonT<=0&&e.burnT<=0)e.hp=Math.min(e.max,e.hp+e.max*regen*dt);
    if(e.kind.tag==='Healer'){
      e.healT-=dt;
      if(e.healT<=0){
        e.healT=2;
        for(const o of R.enemies){if(o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<110)o.hp=Math.min(o.max,o.hp+o.max*0.03);}
      }
    }
    const tgt=R.path.wps[e.wp];
    if(!tgt){leak(e);e.dead=true;continue;}
    const spd=(52+e.kind.spd*22)*e.kind.spd*(1-e.slow)*enemySpeed;
    const dx=tgt.x-e.x,dy=tgt.y-e.y,d=Math.hypot(dx,dy);
    if(d<spd*dt){e.x=tgt.x;e.y=tgt.y;e.wp++;}
    else{e.x+=dx/d*spd*dt;e.y+=dy/d*spd*dt;}
  }
  for(const t of R.towers){
    const st=towerStats(t),role=TW[t.id].role,sp=wk5Special(t);
    if(role==='income'){
      t.acc=(t.acc||0)+dt;
      if(t.acc>=1){
        t.acc-=1;
        const base=4*Math.pow(2.0,TW[t.id].tier-1);
        const ramp=sp&&sp.coinRamp?1+sp.coinRamp*(t.lv||0):1;
        const mult=sp&&sp.coinMul?sp.coinMul:1;
         const g=Math.round(base*(1+(S.settings?.balance?.incomeCardGrowth??WK6_BALANCE.incomeCardGrowth)*(cardLv(t.id)-1))*(1+(S.settings?.balance?.incomePersonalGrowth??WK6_BALANCE.incomePersonalGrowth)*(t.lv||0))*ramp*mult*(S.settings?.balance?.incomeBase??WK6_BALANCE.incomeBase)*wk5PathMult('coinMult',1));
        gain(g,0);
        fx(t.cx*CELL+CELL/2,t.cy*CELL+CELL/2,'+'+g,'#f0c36a');
      }
      continue;
    }
    if(role==='support')continue;
    t.cool=(t.cool||0)-dt;
    if(t.cool>0)continue;
    const px=t.cx*CELL+CELL/2,py=t.cy*CELL+CELL/2,rr=st.rng*CELL;
    let best=null,bestP=-1;
    for(const e of R.enemies){
      if(e.dead)continue;
      const d=Math.hypot(e.x-px,e.y-py);
      if(d<=rr){const score=e.wp*1000-d;if(score>bestP){bestP=score;best=e;}}
    }
    if(!best)continue;
    t.cool=st.cd;
    t.ang=Math.atan2(best.y-py,best.x-px);
    fire(t,st,best,px,py,rr);
  }
  for(const p of R.shots){
    if(p.target&&!p.target.dead){p.tx=p.target.x;p.ty=p.target.y;}
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
    if(d<p.spd*dt){hit(p);p.dead=true;}
    else{p.x+=dx/d*p.spd*dt;p.y+=dy/d*p.spd*dt;}
    p.life=(p.life||0)+dt;
    if(p.life>3)p.dead=true;
  }
  R.shots=R.shots.filter(p=>!p.dead);
  for(const e of R.enemies){if(e.dead)continue;if(e.hp<=0){e.dead=true;kill(e);}}
  R.enemies=R.enemies.filter(e=>!e.dead);
  for(const f of R.fx){f.t-=dt;f.y-=22*dt;}
  R.fx=R.fx.filter(f=>f.t>0);
  if(R.running&&!R.spawnQ.length&&!R.enemies.length){
    R.running=false;
    S.contracts.stats.fieldcount=Math.max(S.contracts.stats.fieldcount||0,R.towers.length);
    if(R.wave>=R.waves){
      levelComplete();
    }else{
      S.contracts.stats.waves++;
      if(!(R.waveLeaks||0))S.contracts.stats.noleak++;
  const reward=Math.round((S.settings?.balance?.waveRewardBase??WK6_BALANCE.waveRewardBase)*Math.pow((S.settings?.balance?.waveRewardGrowth??WK6_BALANCE.waveRewardGrowth),(S.set-1)*(S.settings?.progression?.levelsPerRealm||5)+S.level-1)*wk5PathMult('waveRewardMult',1));
      gain(reward,0);
      log('Wave '+R.wave+' cleared. +'+reward+' 🪙');
      wk5CheckContracts();
      sync();
    }
  }
}

draw=function(){
  wk6BaseDraw();
  if(!R) return;
  const now=performance.now()/1000, pulse=0.5+0.5*Math.sin(now*4);
  // ghost preview of the tower being placed
  if(R.sel&&R.hover&&TW[R.sel]){
    const {x,y}=R.hover;
    const ok=!R.path.set.has(x+','+y)&&!R.towers.some(t=>t.cx===x&&t.cy===y)&&R.towers.length<fieldCapacity();
    ctx.save();
    ctx.globalAlpha=.55+.25*pulse;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='26px serif';
    ctx.fillText(TW[R.sel].emoji,x*CELL+CELL/2,y*CELL+CELL/2+1);
    ctx.globalAlpha=1;
    ctx.strokeStyle=ok?'rgba(255,215,106,'+(0.65+0.35*pulse)+')':'rgba(255,80,80,.9)';
    ctx.lineWidth=3;
    const g=4,L=13,X=x*CELL,Y=y*CELL;
    ctx.beginPath();
    ctx.moveTo(X+g,Y+g+L);ctx.lineTo(X+g,Y+g);ctx.lineTo(X+g+L,Y+g);
    ctx.moveTo(X+CELL-g-L,Y+g);ctx.lineTo(X+CELL-g,Y+g);ctx.lineTo(X+CELL-g,Y+g+L);
    ctx.moveTo(X+CELL-g,Y+CELL-g-L);ctx.lineTo(X+CELL-g,Y+CELL-g);ctx.lineTo(X+CELL-g-L,Y+CELL-g);
    ctx.moveTo(X+g+L,Y+CELL-g);ctx.lineTo(X+g,Y+CELL-g);ctx.lineTo(X+g,Y+CELL-g-L);
    ctx.stroke();
    ctx.restore();
  }
  // animated ring around the selected tower
  if(R.selTower){
    const x=R.selTower.cx*CELL, y=R.selTower.cy*CELL;
    ctx.save();
    ctx.setLineDash([7,5]);
    ctx.lineDashOffset=-now*22;
    ctx.strokeStyle='rgba(255,215,106,'+(0.7+0.3*pulse)+')';
    ctx.lineWidth=3.5;
    roundRect(x+3,y+3,CELL-6,CELL-6,10);
    ctx.stroke();
    ctx.restore();
  }
  wk6UpdateSelHud();
};

  const st=S.contracts.stats;
  for(const k of ['kills','waves','levels','levelsPerfect','builds','redeploys','personal','cardups','coins','spent','gems','noleak','bosses','specials','sold','wavesstarted','fieldcount','contractsCompleted']) if(typeof st[k]!=='number') st[k]=0;
  if(!st.enemyKills) st.enemyKills={};
  if(!st.roleKills) st.roleKills={};
  if(!st.rolesBuilt) st.rolesBuilt={};
  if(!st.classKills) st.classKills={};
  if(!Array.isArray(S.contracts.active)) S.contracts.active=[];
  S.contracts.active=S.contracts.active.filter(c=>c&&WK6_MAP[c.id]).slice(0,4);
  for(const c of S.contracts.active) if(c.start==null) c.start=wk6RawMetric(c);
  let guard=0;
  while(S.contracts.active.length<4&&guard++<60){
    const c=wk6MakeContract();
    if(c&&!S.contracts.active.some(x=>x.id===c.id&&x.extra===c.extra)) S.contracts.active.push(c);
  }
  const key=S.set+'-'+S.level;
  if(!S.contracts.freeKey||S.contracts.freeKey!==key){ S.contracts.freeKey=key; S.contracts.freeUsed=false; }

    case 'enemy': return (st.enemyKills&&st.enemyKills[c.extra])||0;
    case 'rolekills': return (st.roleKills&&st.roleKills[c.extra])||0;
    case 'rolebuilds': return (st.rolesBuilt&&st.rolesBuilt[c.extra])||0;
    case 'classkills': return (st.classKills&&st.classKills[c.extra])||0;
    case 'cardlevel': { let m=1; for(const id of Object.keys(S.cards||{})) m=Math.max(m,S.cards[id]||1); return m; }

    const need=d.template.needs;
    if(need==='role'&&!roles.length) continue;

  const num=(path,label,step=.01)=>`<label class="wkField"><span>${label}</span><input type="number" data-wk-setting="${path}" value="${get(path)}" step="${step}" onchange="wkApplySetting(this)"></label>`;

  wk5TreasuryCollapse=function(){const before=S.gems;oldCollapse();const p=settings().progression;if(!p.removeGemsOnDeath)S.gems=before;else{const loss=Math.max(0,Math.min(S.gems,Math.round(p.gemLossMin+Math.random()*Math.max(0,p.gemLossMax-p.gemLossMin))));S.gems=Math.max(0,before-loss);}sync();};

  function useDefaultRoad(){
    S.levelChoice={set:S.set,level:S.level,id:'default'};
    closeOverlay(); log('🛣️ Default Road chosen — no route trade-off.'); save(true); render(); sync(); startWave();
  }
  window.wk8UseDefaultRoad=useDefaultRoad;
  const oldOpenChoice=wk5OpenLevelChoice;
  wk5OpenLevelChoice=function(){
    if(!kg('progression.offerPaths',true))return useDefaultRoad();
    const offers=wk5SeededOffers();
    overlay(`<h2>🗺️ Choose Your Route</h2><p>Realm ${S.set} · Level ${S.level}</p>
      <p class="mini">Routes are optional. Choose a modifier, or use the default road with no trade-off.</p>
      <div class="choiceGrid">${offers.map(p=>`<div class="choice"><h4>${p.e} ${p.name}</h4><p>${p.desc}</p><p class="trade"><b>Trade-off:</b> ${p.trade}</p><button class="go" onclick="wk5ChoosePath('${p.id}')">Take this route</button></div>`).join('')}</div>
      <p><button class="dark" onclick="wk8UseDefaultRoad()">🛣️ Use Default Road</button></p>`);
  };
  const oldStartWave=startWave;
  startWave=function(){
    if(S&&S.set===1&&S.level===1&&R&&R.wave===0){
      const owned=(R.towers||[]).length+Object.values(S.invCards||{}).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0);
      if(!owned&&S.coins<1500){S.coins=1500;toast('🏰 No towers yet — 1,500 starter coins granted');log('🏰 The empty armory grants 1,500 starter coins for Wave 1.');}
    }
    if(!kg('progression.offerPaths',true)&&!S.levelChoice)S.levelChoice={set:S.set,level:S.level,id:'default'};
    return oldStartWave();
  };

  /* Leak rules: coins can reach zero without killing the run when livesOnly is on.
     The multiplier is deliberately applied to the final leak bill, after route modifiers. */
  const oldLeak=leak;
  leak=function(e){
    const s=ks(), livesOnly=!!s.progression.livesOnly;
    if(!R)return;
    S.leaks++; R.waveLeaks=(R.waveLeaks||0)+1;
    if(S.insure>0){S.insure--;log('🛡️ Insurance absorbed a leak! ('+S.insure+' left)');sync();return;}
    const tag=e.kind?.tag||'', size=e.boss?'boss':e.mini?'large':(['Armored','Warded','Healer'].includes(tag)?'medium':'small');
    const configured=(s.enemies&&s.enemies.livesLostBySize&&s.enemies.livesLostBySize[size]);
    const lifeLoss=configured==null?(e.boss?10:e.mini?3:1):Number(configured);
    let loss=Math.round((18+e.max*.075)*(e.boss?6:e.mini?2.5:1)*wk5PathMult('leakLoss',1)*Number(s.economy.leakCostMultiplier||1));
    loss=Math.round(loss*(1-gl('refund')*.10));
    S.coins=Math.max(0,S.coins-loss);
    S.lives-=lifeLoss;
    fx(e.x,e.y,'-'+loss,'#e86b6b');
    log('💥 A '+(tag||'foe')+' escaped: −'+loss+' coins and −'+lifeLoss+' ❤️.');
    if(!livesOnly&&S.coins===0)return wk5TreasuryCollapse();
    if(S.lives<=0)gameOver();
    sync();
  };

  /* Custom specials can be authored as a set. The combat engine already knows
     these properties, so the merged object makes all enabled abilities active. */
  const oldSpecial=wk5Special;
  wk5Special=function(card){
    const arr=card&&Array.isArray(card.customSpecials)?card.customSpecials.filter(x=>x&&x.name):
      (card&&TW[card.id]&&Array.isArray(TW[card.id].customSpecials)?TW[card.id].customSpecials.filter(x=>x&&x.name):[]);
    if(!arr.length){
      if(card&&card.customSpecial)return card.customSpecial;
      if(card&&TW[card.id]?.customSpecial)return TW[card.id].customSpecial;
      return oldSpecial(card);
    }
    const mult=['dmgMul','rateMul','splashMul','slowMul','poisMul','poisT','burnMul','coinMul'];
    const out={id:'custom-multi',name:arr.map(x=>x.name).join(' + '),desc:arr.map(x=>x.desc).filter(Boolean).join(' '),};
    arr.forEach(x=>Object.keys(x).forEach(k=>{
      if(k==='id'||k==='name'||k==='desc')return;
      if(mult.includes(k))out[k]=(out[k]==null?1:out[k])*(Number(x[k])||1);
      else out[k]=(out[k]||0)+(Number(x[k])||0);
    }));
    return out;
  };

  /* Import/export bundle for settings + custom cards without overwriting progress. */
  function download(name,data){
    const blob=new Blob([typeof data==='string'?data:JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1200);
  }
  function bundle(){return {format:'wayfarer-keeper-bundle',version:1,exportedAt:new Date().toISOString(),settings:clone(S.settings||{}),customCards:clone(S.customCards||[])};}
  window.wk8ExportBundle=function(){save(true);download('wayfarer-settings-and-custom-cards.json',bundle());toast('✅ Settings + custom cards exported');};
  const bin=document.createElement('input');bin.type='file';bin.accept='application/json';bin.style.display='none';bin.id='wk8BundleIn';document.body.appendChild(bin);
  bin.addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const o=JSON.parse(r.result);
        if(o.format!=='wayfarer-keeper-bundle')throw Error('not bundle');
        S.settings=merge(KDEFAULT,o.settings||{});
        S.customCards=Array.isArray(o.customCards)?o.customCards:[];
        normalizeSave();save(true);render();sync();toast('✅ Settings + custom cards imported');
      }catch(err){toast('⚠️ Not a settings/card bundle');}
    };
    r.readAsText(f);e.target.value='';
  });
  window.wk8ImportBundle=()=>bin.click();

  /* Reset progression, but preserve the keeper's rules and authored cards.
     A full JSON backup is downloaded before the reset, as requested. */
  window.wk8ResetProgress=function(){
    if(!confirm('Reset to Realm 1 · Level 1? A full save export will be downloaded first. Settings and custom cards will be kept.'))return;
    save(true);
    download('wayfarer-kingdoms-before-reset-'+Date.now()+'.json',JSON.stringify(snapshot(),null,2));
    const keepSettings=clone(S.settings||{}),keepCards=clone(S.customCards||[]);
    S=newSave();
    S.settings=keepSettings;S.customCards=keepCards;S.coins=1500;S.gems=Number(keepSettings.progression?.startingGems??S.gems)||S.gems;
    S.levelChoice=null;S.autoStart=false;S.seenTutorial=true;
    normalizeSave();R=null;buildRun(false);restoreField();save(true);render();sync();closeOverlay();
    toast('↩️ Progress reset — settings and custom cards kept');
  };

  /* Extra settings are appended to the existing full workshop so older fields
     and newer keeper fields can coexist in the same save. */
  const oldOpenSettings=window.wkOpenSettings;
  window.wk8ApplyExtraSettings=function(){
    const q=id=>document.getElementById(id), n=id=>Number(q(id)?.value||0);
    kset('progression.livesOnly',!!q('wk8LivesOnly')?.checked);
    kset('progression.offerPaths',!!q('wk8OfferPaths')?.checked);
    kset('progression.levelThemes',!!q('wk8LevelThemes')?.checked);
    kset('progression.pathDesign',q('wk8PathDesign')?.value||'per-level');
    const leakValue=Number(q('wk8LeakMultiplier')?.value);
    kset('economy.leakCostMultiplier',Number.isFinite(leakValue)?Math.max(0,leakValue):1);
    kset('presentation.showHints',!!q('wk8ShowHints')?.checked);
    S.lives=Math.min(S.lives,maxLives());
    if(S.contracts?.stats)S.contracts.stats.settings=(S.contracts.stats.settings||0)+1;
    save(true);render();sync();closeOverlay();toast('⚙️ Keeper rules applied');
  };
  window.wkOpenSettings=function(){
    oldOpenSettings();
    const box=document.getElementById('obox');if(!box)return;
    const extra=document.createElement('section');extra.className='wkSection';
    extra.innerHTML=`<h3>Keeper Rules & Level Design</h3>
      <p class="mini">These options are saved in the kingdom and included in the settings/card bundle.</p>
      <label class="wkToggle" title="Leaks still remove coins, but reaching 0 coins will not trigger Treasury Collapse. You only lose when lives reach 0."><span>🛡️ Lives-only defeat</span><input id="wk8LivesOnly" type="checkbox" ${kg('progression.livesOnly',false)?'checked':''}><b></b></label>
      <div class="mini">When enabled, running out of 🪙 is allowed; only ❤️ reaching 0 ends the attempt.</div>
      <label class="wkField" title="Multiplies the coin bill after a leak. 1.00 is normal, 0.50 is half, and 2.00 is double."><span>💸 Leak coin cost multiplier</span><input id="wk8LeakMultiplier" type="number" min="0" step=".05" value="${kg('economy.leakCostMultiplier',1)}"></label>
      <div class="mini">1.00 = normal leak cost · 0.50 = half cost · 2.00 = double cost.</div>
      <label class="wkToggle" title="If off, every level uses the classic Default Road automatically."><span>🗺️ Offer route choices</span><input id="wk8OfferPaths" type="checkbox" ${kg('progression.offerPaths',true)?'checked':''}><b></b></label>
      <label class="wkField" title="Changes the deterministic road seed while keeping the road valid."><span>🛣️ Level road design</span><select id="wk8PathDesign"><option value="per-level">Per-level variety</option><option value="classic">Classic</option><option value="twist">Twist roads</option><option value="wide">Wide roads</option><option value="compact">Compact roads</option></select></label>
      <label class="wkToggle" title="Uses a different visual theme on each level instead of only changing it at realm boundaries."><span>🎨 Theme every level</span><input id="wk8LevelThemes" type="checkbox" ${kg('progression.levelThemes',true)?'checked':''}><b></b></label>
      <label class="wkToggle" title="Keeps the plain-English explanations and reminders visible."><span>💡 Show gameplay hints</span><input id="wk8ShowHints" type="checkbox" ${kg('presentation.showHints',true)?'checked':''}><b></b></label>
      <div class="row"><button class="go" onclick="wk8ApplyExtraSettings()">Apply Keeper Rules</button></div>`;
    box.appendChild(extra);
    const select=extra.querySelector('#wk8PathDesign');if(select)select.value=kg('progression.pathDesign','per-level');
  };

  /* A larger save menu exposes the separate bundle tools and safe reset. */
  window.wk8OpenSaveMenu=function(){
    const when=S.lastSavedAt?new Date(S.lastSavedAt).toLocaleString():'not yet';
    overlay(`<h2>💾 Save Menu</h2><p class="mini">Realm ${S.set} · Level ${S.level} · 🪙 ${fmt(S.coins)} · 💎 ${fmt(S.gems)}<br>Last saved: <b>${when}</b></p>
      <div class="menuGrid">
        <button class="go" onclick="wk6SaveNow()">💾 Save Now</button><button class="dark" onclick="doExport()">⬇ Export Full Save</button>
        <button class="dark" onclick="document.getElementById('fileIn').click()">⬆ Import Full Save</button><button class="dark" onclick="wk8ExportBundle()">🧰 Export Settings + Cards</button>
        <button class="dark" onclick="wk8ImportBundle()">🧰 Import Settings + Cards</button><button class="bad" onclick="wk8ResetProgress()">↩️ Reset to Realm 1</button>
      </div>
      <p class="mini">The Reset button downloads a full backup first, then keeps only your rules and custom cards while returning progression to Realm 1 · Level 1.</p>
      <textarea id="wk8SaveBox">${btoa(unescape(encodeURIComponent(JSON.stringify(snapshot()))))}</textarea>
      <div class="row" style="justify-content:center"><button class="dark" onclick="wk6CopySave()">📋 Copy Full Save</button><button class="dark" onclick="closeOverlay()">Close</button></div>`);
  };
  const menu=document.getElementById('btnMenu');if(menu)menu.onclick=wk8OpenSaveMenu;
  const rules=document.getElementById('btnRules');if(rules)rules.onclick=()=>window.wkOpenSettings();
  const saveTabHTML=saveHTML;
  saveHTML=function(){
    return saveTabHTML().replace('<button class="go" onclick="wk6OpenSaveMenu()">💾 Open Save Menu</button>','<button class="go" onclick="wk8OpenSaveMenu()">💾 Open Save Menu</button>')+
      '<div class="row"><button class="dark" onclick="wk8ExportBundle()">🧰 Export Settings + Cards</button><button class="dark" onclick="wk8ImportBundle()">🧰 Import Settings + Cards</button><button class="bad" onclick="wk8ResetProgress()">↩️ Reset Progress</button></div>';
  };

  /* Make custom card lock rules visible in the armory and enforce them for
     inventory placement as well as purchased placement. */
  const oldTcard=tcard;
  tcard=function(t,extra,cls){
    const html=oldTcard(t,extra,cls);
    const lock=t.customCard&&S.set<(t.unlockSet||1);
    if(!lock)return html;
    return html.replace('<div class="pr">','<div class="mini">🔒 Custom card unlocks at Realm '+t.unlockSet+'</div><div class="pr">');
  };
  const oldPlace=placeAt;
  placeAt=function(cx,cy){
    if(R&&R.sel&&TW[R.sel]?.customCard&&S.set<(TW[R.sel].unlockSet||1))return toast('🔒 Custom card locked until Realm '+TW[R.sel].unlockSet);
    return oldPlace(cx,cy);
  };

  /* Boot runs asynchronously above. It will normalize and render after this
     compatibility layer has installed its overrides; do not touch S while the
     IndexedDB load is still in flight. */
})();
</script>
</body>
</html>
